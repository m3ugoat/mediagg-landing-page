<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening in Mediagg</title>
<meta name="theme-color" content="#121212">
<!--
  A link into Mediagg: /open?url=<address>[&title=…] (mediagg-kmp DEEPLINKS.md). With the app installed,
  Android opens it there and this page is never seen. Without it, this sends the address on to Mediagg
  in the browser, which opens it — and on Android offers the app first.
-->
<script>
  // The address is everything after url= where it is written plainly (url=https://host/feed?id=4&x=1),
  // and the one parameter, decoded, where it was escaped — mediagg-kmp DeepLinks' rule.
  (function () {
    var q = location.search.replace(/^\?/, '');
    var at = q.indexOf('url=') === 0 ? 0 : (q.indexOf('&url=') >= 0 ? q.indexOf('&url=') + 1 : -1);
    var url = at < 0 ? '' : q.substring(at + 4);
    if (url && url.indexOf('://') < 0) {
      url = url.split('&')[0];
      try { url = decodeURIComponent(url.replace(/\+/g, ' ')); } catch (e) {}
    }
    var web = location.origin + '/web/' + (url ? '?open=' + url : '');
    // **On Android, the app by name** (`intent://`, scheme mediagg, package app.mediagg): one component
    // matches it, so Chrome neither asks "Chrome or Mediagg?" nor lists Mediagg twice (MainActivity and
    // the catch-all .OpenAddress both take https links). Without the app, Chrome opens the web app instead.
    if (url && /Android/i.test(navigator.userAgent)) {
      location.replace('intent://open?url=' + encodeURIComponent(url) +
        '#Intent;scheme=mediagg;package=app.mediagg;S.browser_fallback_url=' + encodeURIComponent(web) + ';end');
      return;
    }
    location.replace(web);
  })();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #121212; color: #e6e1e5;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; }
  a { color: #d0bcff; }
</style>
</head>
<body>
  <p>Opening in Mediagg… <noscript><br><a href="/web/">Open Mediagg in your browser</a></noscript></p>
</body>
</html>
