<!-- There is one Mediagg now, not two editions, so this page has nothing of its own left to say.
     A redirect rather than a deletion: the old URL was linked from the home page for months and is
     in people's history, and a 404 is a worse answer than the page that replaced it.
     canonical + noindex retires it from search; the meta refresh moves anyone who arrives. -->
<link rel="canonical" href="https://mediagg.app/">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=/">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/mediagg.png">

  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  text-align:center;padding:24px}

</style>
