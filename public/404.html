:root{--bg:#0b0d10;--ink:#f2f5f8;--muted:#93a1b0;--dim:#6c7a89;--red:#ff3d3d;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
 font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
 -webkit-font-smoothing:antialiased;overflow-x:hidden}
main.nf{flex:1;display:grid;place-items:center;text-align:center;padding:48px 24px}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.42;pointer-events:none}
.b1{width:520px;height:520px;background:radial-gradient(circle,#ff1616,transparent 62%);top:-180px;left:-140px}
.b2{width:460px;height:460px;background:radial-gradient(circle,#8b7bff,transparent 62%);bottom:-180px;right:-140px}
.in{position:relative;z-index:2}
.eq{display:inline-flex;align-items:flex-end;gap:4px;height:52px;margin-bottom:26px}
.eq i{width:8px;background:linear-gradient(180deg,var(--red),#ffb443);border-radius:4px;animation:b 1.05s ease-in-out infinite}
.eq i:nth-child(1){height:40%;animation-delay:-.5s}.eq i:nth-child(2){height:85%;animation-delay:-.25s}
.eq i:nth-child(3){height:60%;animation-delay:-.75s}.eq i:nth-child(4){height:100%}
.eq i:nth-child(5){height:52%;animation-delay:-.35s}
@keyframes b{0%,100%{transform:scaleY(.28)}50%{transform:scaleY(1)}}
h1{font-size:clamp(2.2rem,7vw,3.4rem);letter-spacing:-.035em;margin:0 0 14px}
p{color:var(--muted);margin:0 0 30px}
a.btn{display:inline-flex;align-items:center;gap:9px;border-radius:100px;padding:12px 24px;font-weight:700;
 text-decoration:none;color:#fff;background:linear-gradient(120deg,var(--red),#ff7a2f);
 box-shadow:0 10px 34px rgba(255,61,61,.32);transition:transform .25s}
a.btn:hover{transform:translateY(-2px)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* The site's header and footer (mediagg.app redesign), the same on every page: their own classes,
   so this page's styling of its body is left as it was. */
header.mg-top{position:sticky;top:0;z-index:50;padding:0;margin:0;background:rgba(15,14,19,.92);
 -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid #2B2930;
 font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-align:left}
.mg-wrap{max-width:1200px;margin:0 auto;padding:0 32px;box-sizing:border-box}
header.mg-top .mg-wrap{display:flex;align-items:center;gap:12px 28px;min-height:64px}
a.mg-brand{display:flex;align-items:center;gap:12px;color:#E6E0E9;font-size:20px;font-weight:700;text-decoration:none;margin:0}
a.mg-brand img{border-radius:8px}
nav.mg-nav{display:flex;align-items:center;gap:4px 22px;margin-left:auto;font-weight:500}
nav.mg-nav a{color:#CAC4D0;text-decoration:none;margin:0}
nav.mg-nav a:hover{color:#E6E0E9}
nav.mg-nav a.mg-btn{display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:20px;background:#D0BCFF;color:#381E72;font-weight:600;white-space:nowrap}
nav.mg-nav a.mg-btn:hover{background:#EADDFF;color:#381E72}
footer.mg-foot{border-top:1px solid #2B2930;padding:32px 0 48px;margin:0;color:#CAC4D0;
 font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-align:left}
footer.mg-foot .mg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px}
footer.mg-foot .mg-c{margin-right:auto;font-size:13px}
footer.mg-foot a{color:#D0BCFF;text-decoration:none;margin:0}
footer.mg-foot a:hover{color:#EADDFF}
@media (max-width:720px){.mg-wrap{padding:0 20px}nav.mg-nav .mg-opt{display:none}}
header.mg-top,footer.mg-foot{position:relative;z-index:3}
header.mg-top{position:sticky}
</style>
</head>
