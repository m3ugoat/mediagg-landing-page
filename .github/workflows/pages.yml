# Publishes the static site to GitHub Pages.
#
# This is the only deploy: mediagg.app is served by GitHub Pages. There is no build step — the pages
# are plain HTML with their CSS inline, the documentation is generated and committed, and the job
# just uploads public/ and hands it to Pages.
#
# Deploying through Actions rather than the "deploy from a branch" setting matters here. Branch
# deploys can only serve the repository root or /docs, and neither is the site — the root holds the
# retired Jekyll sources and /docs holds design files. Actions can publish any directory, so the site
# lives in public/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    # Only the site and this workflow affect the deploy. Editing README.md, or the design sources in
    # docs/, should not spend a deploy.
    paths:
      - 'public/**'
      - '.github/workflows/pages.yml'
      # The documentation sources are here so that editing one WITHOUT regenerating still starts a
      # run. public/ would be unchanged in that case, so without these two lines the stale-output
      # check below would never get the chance to fail.
      - 'content/**'
      - 'scripts/**'
      # Which build of Mediagg in the browser /web/ serves: moving it is a deploy.
      - 'web-client.release'
  # Lets a deploy be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # deploy-pages authenticates to Pages with an OIDC token rather than a stored secret; without this
  # the deploy step fails even though `pages: write` is granted.
  id-token: write

# Queue deploys instead of cancelling in-flight ones, so a run that is already publishing finishes
# rather than leaving the site half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # public/documentation/ is generated from content/documentation/ and committed. This proves
      # the two agree, so a deploy can never ship documentation that no longer matches its source.
      # It installs nothing: the generator is stdlib-only and ubuntu-latest already has python3.
      - name: Documentation is up to date
        run: python3 scripts/build-docs.py --check

      # **Mediagg in the browser, at /web/** — mediagg-kmp's `:webApp`, the build web-client.release
      # names, from mediagg-releases (public). Not committed here: it is tens of megabytes of .wasm
      # each release, and the site's history would carry every one. Checked against the sum the file
      # gives, and the deploy stops rather than publish a site without it.
      - name: Mediagg in the browser
        run: |
          set -eu
          tag="$(grep -v '^#' web-client.release | awk 'NF{print $1; exit}')"
          sum="$(grep -v '^#' web-client.release | awk 'NF{print $2; exit}')"
          curl -fsSL -o web-client.tar.gz \
            "https://github.com/m3ugoat/mediagg-releases/releases/download/$tag/web-client.tar.gz"
          echo "$sum  web-client.tar.gz" | sha256sum -c -
          mkdir -p public/web
          tar -xzf web-client.tar.gz -C public/web
          test -f public/web/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
