# No build step.
#
# This used to run `npm run build`: webpack, then Jekyll. That stopped working when Netlify moved to
# the noble build image, which resolves Ruby 3.4 through mise. Gemfile.lock pins Bundler 2.1.4, and
# Bundler 2.1.4 cannot load on Ruby 3.4 — it reaches for DidYouMean::SPELL_CHECKERS, which no longer
# exists. The build died during dependency installation, so nothing had been deployed since 2022.
#
# There is nothing left for either tool to do. The three pages are plain HTML with their CSS inline,
# and the only assets are the screenshots in `public/screens/`, so Netlify simply serves the files in
# `public/`. Nothing to install, nothing to pin, nothing that ages.
#
# The Jekyll and webpack sources are still in the repository — _layouts, _includes, _src, _scss,
# config/, package.json, Gemfile — dormant rather than deleted, in case the templating is wanted
# again. Reviving it means restoring `command` below and moving the pages back out of `public/`.

[build]
  publish = "public"
  # An explicit no-op rather than no command at all. With the field empty Netlify falls back to
  # framework detection, and anything that looks like a Jekyll or Node project in the root sends it
  # looking for a toolchain that is no longer installed. Saying "nothing to build" out loud stops it
  # guessing.
  command = "echo 'Static site — nothing to build.'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
